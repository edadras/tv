name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # The design previews render golden images; they are a review tool, not a
      # regression suite, so dart_test.yaml skips them here.
      - run: flutter test

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # One universal APK: the point of this app is being able to drop a single
      # file onto any phone or TV and have it install.
      - name: Build universal APK
        run: flutter build apk --release

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: LanCast-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
